[project]
name = "image-recognition"
version = "0.1.0"
description = "Etkinlik fotoğraf ve videolarında kayıtlı kişileri ayırır."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.12",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
recognize = "recognize.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recognize"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
